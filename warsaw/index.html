<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BetterMe Private Club — Warsaw Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../style.css" />
</head>
<body data-event="warsaw">
  <main class="card">
    <img class="logo" src="../assets/logo.png" alt="BetterMe Private Club" />
    <p class="event-meta">29 August 2026 · Warsaw</p>
    <h1 class="welcome">Welcome to the BetterMe Private Club</h1>
    <p class="subtitle">Your exclusive experience begins here. Please select your name to complete your member check-in.</p>

    <form id="registration-form" autocomplete="off">
      <div class="field">
        <label for="name-input">Full name</label>
        <div class="autocomplete">
          <input
            type="text"
            id="name-input"
            placeholder="Start typing your first or last name…"
            autocomplete="off"
            required
          />
          <ul id="suggestions" class="suggestions" hidden></ul>
        </div>
      </div>

      <button type="submit" id="submit-btn" disabled>Check In</button>
    </form>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="../config.js"></script>
  <script src="../script.js"></script>
</body>
</html>
