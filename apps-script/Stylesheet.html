:root {
  color-scheme: light;
  --bg: #f8f1e9;
  --card-bg: #fffdfa;
  --text: #43322e;
  --muted: #a69e96;
  --border: #e6ddd0;
  --accent: #43322e;
  --accent-hover: #5f453e;
  --error: #a4453b;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100vh;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font-family: "Aeonik Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.card {
  width: 100%;
  max-width: 640px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  text-align: center;
}

.logo {
  height: 40px;
  width: auto;
  margin: 0 auto 16px;
  display: block;
}

.welcome {
  font-family: "Aeonik Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: clamp(0.85rem, calc(5.86vw - 6.57px), 1.9rem);
  white-space: nowrap;
  margin: 0 0 12px;
}

/* Дуже вузькі екрани (рідкісні старі телефони) — дозволяємо перенос,
   аби заголовок не виходив за межі картки. */
@media (max-width: 360px) {
  .welcome {
    white-space: normal;
    font-size: 1rem;
  }
}

.subtitle {
  margin: 0 0 24px;
  color: var(--muted);
  font-size: 0.95rem;
  text-align: center;
}

.field {
  text-align: left;
  margin-bottom: 20px;
}

/* Комфортні пропорції для планшетів ~11" (напр. iPad 11") у портретній
   та альбомній орієнтації — ширші поля, крупніший текст під дотик. */
@media (min-width: 700px) {
  .card {
    max-width: 1040px;
    min-height: clamp(480px, 70vh, 800px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
    border-radius: 20px;
  }

  .logo {
    height: 52px;
    margin-bottom: 20px;
  }

  .welcome {
    font-size: clamp(2rem, calc(5.86vw - 8.44px), 2.3rem);
  }

  .subtitle {
    font-size: 1.05rem;
    margin-bottom: 32px;
  }

  label {
    font-size: 1rem;
  }

  input[type="text"] {
    padding: 16px 18px;
    font-size: 1.1rem;
    border-radius: 12px;
  }

  .suggestions {
    max-height: 280px;
    padding: 8px;
  }

  .suggestions li {
    padding: 14px 16px;
    font-size: 1.05rem;
  }

  button[type="submit"] {
    padding: 16px 18px;
    font-size: 1.1rem;
    border-radius: 12px;
  }

  .status {
    font-size: 1rem;
  }
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 0.9rem;
  font-weight: 600;
}

.autocomplete {
  position: relative;
}

input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

.suggestions {
  position: absolute;
  z-index: 10;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  margin: 0;
  padding: 6px;
