<script>
(function () {
  const input = document.getElementById("participant-field");
  const suggestionsList = document.getElementById("suggestions");
  const submitBtn = document.getElementById("submit-btn");
  const status = document.getElementById("status");
  const form = document.getElementById("registration-form");

  const EVENT_ID = document.body.dataset.event;
  const MAX_SUGGESTIONS = 30;
  let activeIndex = -1;
  let currentMatches = [];
  let selectedName = null;
  let members = [];
  let membersLoaded = false;

  function normalize(str) {
    return str.toLowerCase();
  }

  function displayLabel(person) {
    return person.uk ? `${person.uk} / ${person.en}` : person.en;
  }

  // Matches word-by-word rather than as one exact substring, since the
  // Ukrainian column stores "Прізвище Ім'я" (surname first) — typing
  // "Ім'я Прізвище" in the more familiar order should still find it.
  function fieldMatches(field, tokens) {
    if (!field) return false;
    const normalized = normalize(field);
    return tokens.every((token) => normalized.includes(token));
  }

  function getMatches(query) {
    const tokens = normalize(query.trim()).split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    return members
      .filter((person) => fieldMatches(person.en, tokens) || fieldMatches(person.uk, tokens))
      .slice(0, MAX_SUGGESTIONS);
  }

  function renderSuggestions(matches) {
    currentMatches = matches;
    activeIndex = -1;
    suggestionsList.innerHTML = "";

    if (matches.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No matches found";
      suggestionsList.appendChild(li);
      suggestionsList.hidden = false;
      return;
    }

    matches.forEach((person, i) => {
      const li = document.createElement("li");
      li.textContent = displayLabel(person);
      li.dataset.index = String(i);
      li.addEventListener("mousedown", (e) => {
        e.preventDefault();
        selectPerson(person);
      });
      suggestionsList.appendChild(li);
    });
    suggestionsList.hidden = false;
  }

  function hideSuggestions() {
    suggestionsList.hidden = true;
    suggestionsList.innerHTML = "";
    activeIndex = -1;
  }

  function selectPerson(person) {
    selectedName = person.en;
    input.value = displayLabel(person);
    hideSuggestions();
    submitBtn.disabled = false;
  }

  function updateActive(newIndex) {
    const items = suggestionsList.querySelectorAll("li:not(.empty)");
    items.forEach((el) => el.classList.remove("active"));
    if (newIndex >= 0 && newIndex < items.length) {
      items[newIndex].classList.add("active");
      items[newIndex].scrollIntoView({ block: "nearest" });
    }
    activeIndex = newIndex;
  }

  input.addEventListener("input", () => {
    selectedName = null;
    submitBtn.disabled = true;
    status.textContent = "";
    status.className = "status";
    const matches = getMatches(input.value);
    if (input.value.trim().length === 0) {
      hideSuggestions();
      return;
    }
    renderSuggestions(matches);
  });

  input.addEventListener("keydown", (e) => {
    const items = suggestionsList.querySelectorAll("li:not(.empty)");
    if (suggestionsList.hidden || items.length === 0) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      updateActive(Math.min(activeIndex + 1, items.length - 1));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      updateActive(Math.max(activeIndex - 1, 0));
    } else if (e.key === "Enter") {
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        e.preventDefault();
        selectPerson(currentMatches[activeIndex]);
      }
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".autocomplete")) {
      hideSuggestions();
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    if (!membersLoaded) {
      status.textContent = "Member list is still loading. Please wait.";
      status.className = "status error";
      return;
    }

    if (!selectedName) {
      status.textContent = "Please select a name from the list.";
      status.className = "status error";
      return;
    }

    if (!EVENT_ID) {
      status.textContent = "Setup error: this page is missing its event id.";
      status.className = "status error";
      return;
    }

    submitBtn.disabled = true;
    status.textContent = "Saving...";
    status.className = "status";

    google.script.run
      .withSuccessHandler(function (result) {
        status.textContent = result.alreadyCheckedIn
          ? `${selectedName} was already checked in — check-in time updated.`
          : `Thank you, ${selectedName}! You're checked in.`;
        status.className = "status success";
        form.reset();
        selectedName = null;
      })
      .withFailureHandler(function (err) {
        status.textContent = "Could not save your check-in. Please try again.";
        status.className = "status error";
        submitBtn.disabled = false;
      })
      .checkIn(selectedName, EVENT_ID);
  });

  function loadMembers() {
    input.disabled = true;
    input.placeholder = "Loading members…";
    status.textContent = "";
    status.className = "status";

    google.script.run
      .withSuccessHandler(function (people) {
        members = people || [];
        membersLoaded = true;
        input.disabled = false;
        input.placeholder = "Start typing your first or last name…";
      })
      .withFailureHandler(function (err) {
        input.placeholder = "Could not load member list.";
        status.textContent = "Could not load the member list. Please reload the page.";
        status.className = "status error";
      })
      .getNames();
  }

  loadMembers();
})();
</script>
